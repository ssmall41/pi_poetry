[output]
dir = "outputs"

[pipeline]
mode = "serial"
debug = false

[digit_source]
type = "file"
path = "data/pi_10000000.txt"
threads = 2
chunk_size = 32768

[digit_mapper]
type = "two-digit-block"
alphabet = "alpha-lower"
base = 10
threads = 1
write_letter_sequence = true

[word_finder]
type = "aho-corasick-cpu"
dictionary = "dictionaries/google-10000-english-trimmed.txt"
overlap_policy = "all-combos"
min_word_length = 1
threads = 1

[phrase_scanner]
type = "human-review"
mode = "gap-tolerant"
max_gap = 5
threads = 1

[analysis]
run_after_pipeline = true
