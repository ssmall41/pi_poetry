[output]
dir = "outputs"

[pipeline]
mode = "serial"

[digit_source]
type = "file"
path = "data/pi_2000.txt"
threads = 1

[digit_mapper]
type = "two-digit-block"
alphabet = "alpha-lower"
base = 10
threads = 1
write_letter_sequence = true

[word_finder]
type = "aho-corasick-cpu"
dictionary = "dictionaries/english_trimmed.txt"
overlap_policy = "all-combos"
min_word_length = 1
threads = 1

[phrase_scanner]
type = "human-review"
mode = "gap-tolerant"
max_gap = 5
threads = 1
